<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e9">
  <meta name="description" content="Maps, routes, conditions, kit, skills and food for getting outside.">
  <link rel="canonical" href="https://smooks.co.uk/outside/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Outside — smooks.">
  <meta property="og:description" content="Maps, routes, conditions, kit, skills and food for getting outside.">
  <meta property="og:url" content="https://smooks.co.uk/outside/">
  <meta property="og:image" content="https://smooks.co.uk/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <title>Outside — smooks.</title>
  <link rel="stylesheet" href="{{CSS}}">
  <script defer src="{{SCRIPT}}"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to resources</a>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="wordmark" href="/" aria-label="smooks, homepage">smooks<span aria-hidden="true">.</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav__link" href="/">Home</a>
        <a class="site-nav__link" href="/outside/" aria-current="page">Outside</a>
        <a class="site-nav__link" href="/play/">Play</a>
      </nav>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    <header class="page-intro">
      <div class="wrap page-intro__inner">
        <p class="eyebrow">A growing collection</p>
        <h1>Outside.</h1>
        <p class="page-intro__lede">Maps, routes, conditions, skills, and a few useful places to start.</p>
      </div>
    </header>
    <div class="wrap directory">
      <nav class="filter-row" aria-label="Resource filters">
        <ul class="filter-row__list">{{FILTERS}}</ul>
      </nav>
      <section class="before-strip" aria-labelledby="before-heading">
        <div class="before-strip__heading">
          <p class="eyebrow">Worth checking</p>
          <h2 id="before-heading">Before you go</h2>
        </div>
        <ul class="before-strip__list">{{BEFORE}}</ul>
      </section>
      <section class="resource-section" aria-labelledby="resource-heading">
        <div class="section-header">
          <h2 id="resource-heading">Useful places</h2>
          <p class="result-status" id="filter-status" aria-live="polite">Showing all {{COUNT}} resource cards.</p>
        </div>
        <div class="resource-grid">{{CARDS}}</div>
      </section>
    </div>
  </main>
  <footer class="site-footer"><div class="wrap site-footer__inner">
    <a class="footer-wordmark" href="/">smooks.</a><p>{{FOOTER}}</p>
  </div></footer>
</body>
</html>
