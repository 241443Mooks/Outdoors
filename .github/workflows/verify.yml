name: Verify website
on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build static website
        run: npm run check
      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/outside/index.html
          test -s dist/styles.css
          test -s dist/script.js
          test -s dist/favicon.svg
          test -s dist/og-image.svg
